<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 Kansai Trip</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="container relative">
      <!-- 語系切換按鈕 -->
      <div class="lang-switch">
        <select id="langSelector" onchange="changeLanguage()">
          <option value="zh">🇹🇼 中文 (ZH)</option>
          <option value="vi">🇻🇳 Tiếng Việt (VI)</option>
        </select>
        <a href="print_a4.html" target="_blank" class="print-btn" id="ui-print-btn">🖨️ 列印 A4</a>
      </div>

      <div class="badge-trip" id="ui-badge">🍁 2026 秋季關西・京都大阪・樂園漫遊</div>
      <h1 id="ui-title">京都・大阪 11 天 10 夜行程規劃</h1>
      <div class="hero-subtitle" id="ui-subtitle">2026/09/29 ～ 2026/10/09 ｜ 中華航空 CI152 / CI153</div>
    </div>
  </header>

  <div class="nav-tabs-wrapper">
    <div class="container">
      <div class="nav-tabs" id="ui-tabs">
        <button class="tab-btn active" onclick="switchTab('itinerary', this)" id="tab-1">📅 每日行程</button>
        <button class="tab-btn" onclick="switchTab('booking', this)" id="tab-2">✈️ 航班住宿</button>
      </div>
    </div>
  </div>

  <main class="container">
    <!-- 行程分頁 -->
    <section id="tab-itinerary" class="tab-content active">
      <div class="day-selector" id="daySelectorContainer"></div>
      <div id="dayContentContainer"></div>
    </section>

    <!-- 航班住宿分頁 -->
    <section id="tab-booking" class="tab-content">
      <div class="grid-2" id="bookingContentContainer"></div>
    </section>
  </main>

  <!-- 引入資料與邏輯 -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
